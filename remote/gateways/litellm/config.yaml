# LiteLLM proxy config for the benchmark. One model, routed at the mock backend
# over the shared docker network. Retries/spend-logging disabled so we measure
# routing overhead, not bookkeeping.
model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: sk-bench-test-key
      api_base: http://mock:9999/v1

general_settings:
  master_key: null
  # Recent releases refuse to start without a master key. No gateway auth here, as in
  # every earlier run and on the other gateways that make it optional.
  dangerously_permit_weak_or_unset_master_key: true
  disable_spend_logs: true

litellm_settings:
  num_retries: 0
  request_timeout: 60
  drop_params: true
  set_verbose: false
