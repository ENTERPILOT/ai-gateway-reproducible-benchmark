# GoModel, configured entirely through environment variables.
# ${GOMODEL_IMAGE} / ${GOMODEL_HOST_PORT} are exported by run-on-instance.sh from gateway.env.
services:
  gomodel:
    profiles: ["gomodel"]
    image: ${GOMODEL_IMAGE:?set by run-on-instance.sh}
    depends_on: [mock]
    ports:
      - "${GOMODEL_HOST_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - GOMODEL_MASTER_KEY=
      - OPENAI_API_KEY=sk-bench-test-key
      - OPENAI_BASE_URL=http://mock:9999/v1
      - LOGGING_ENABLED=false
      - USAGE_ENABLED=false
      - METRICS_ENABLED=false
      - SWAGGER_ENABLED=false
      - PPROF_ENABLED=false
      - ENABLE_PASSTHROUGH_ROUTES=false
      - MODEL_LIST_URL=off
      # Config parity with the no-retry / no-breaker peers (LiteLLM, Bifrost):
      #  - retries off (default is 3).
      #  - circuit breaker off. Under the c=128 sweep a few transient upstream
      #    errors would otherwise trip the default breaker (threshold 5) and
      #    blanket-503 every request. No other gateway has a breaker.
      #    Both switches are set on purpose: CIRCUIT_BREAKER_ENABLED is the
      #    documented one, and the unreachable threshold is what the runs before
      #    2026-09 used on their own (same effect), so it stays as the fallback
      #    for a pinned GOMODEL_IMAGE old enough to predate the env switch.
      - RETRY_MAX_RETRIES=0
      - CIRCUIT_BREAKER_ENABLED=false
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=1000000000
      - STORAGE_TYPE=sqlite
      - SQLITE_PATH=/app/data/gomodel-bench.db
      - GOMODEL_CACHE_DIR=/app/.cache
    restart: "no"
